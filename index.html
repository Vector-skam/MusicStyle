<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Screen</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            user-select: none;
            -webkit-user-select: none;
        }
        body, html { 
            background: #000000; 
            overflow: hidden; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            font-family: 'Courier New', monospace;
            cursor: pointer;
        }
        
        canvas { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block; 
            z-index: 1;
        }
        
        #control-panel {
            position: relative;
            z-index: 10;
            width: 94%;
            max-width: 650px;
            background: rgba(8, 12, 10, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 170, 0.25);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
        }

        #control-panel.hidden {
            opacity: 0;
            transform: translateY(25px);
            pointer-events: none;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .status-badge {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 50, 50, 0.15);
            color: #ff3c3c;
            border: 1px solid rgba(255, 50, 50, 0.3);
            font-weight: bold;
        }
        .status-badge.active {
            background: rgba(0, 255, 170, 0.15);
            color: #00ffaa;
            border: 1px solid rgba(0, 255, 170, 0.4);
        }

        .section-title {
            color: #777;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            text-align: left;
        }

        .row-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .row-grid.themes {
            grid-template-columns: repeat(2, 1fr);
        }
        .row-grid:last-child { margin-bottom: 0; }

        .ui-btn {
            background: rgba(255, 255, 255, 0.02);
            color: #ffffffaa;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 6px;
            font-family: inherit;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ui-btn:hover {
            background: rgba(0, 255, 170, 0.06);
            border-color: rgba(0, 255, 170, 0.3);
            color: #fff;
        }

        .ui-btn.active {
            background: rgba(0, 255, 170, 0.15);
            color: #00ffaa;
            border-color: #00ffaa;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.15);
        }
    </style>
</head>
<body>

    <canvas id="visualizer"></canvas>

    <div id="control-panel">
        <div class="panel-header">
            <div class="section-title" style="margin: 0;">🎛️ Спектральная Станция ASCII</div>
            <div id="statusBadge" class="status-badge">Пауза</div>
        </div>
        
        <div class="section-title">📟 Выберите Тип Аналайзера:</div>
        <div class="row-grid" id="modesGrid">
            <button class="ui-btn active" data-mode="spectrum">📊 Спектр</button>
            <button class="ui-btn" data-mode="mirror">📉 Зеркальный</button>
            <button class="ui-btn" data-mode="fire">💥 Огненный</button>
            <button class="ui-btn" data-mode="osc">📈 Волна</button>
            <button class="ui-btn" data-mode="double_osc">🌊 Двойная Волна</button>
            <button class="ui-btn" data-mode="radial_osc">🌀 Радар</button>
        </div>

        <div class="section-title">🔤 Набор Символов:</div>
        <div class="row-grid themes" id="symbolsGrid">
            </div>
    </div>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const panel = document.getElementById('control-panel');
        const statusBadge = document.getElementById('statusBadge');
        
        let audioCtx, analyser, source, stream;
        let isRecording = false;
        let animationFrameId;
        let animationTime = 0;
        
        let winampMode = 'spectrum'; 
        let currentTheme = 'classic';
        let winampPeaks = []; 
        let idleTimer;

        const themes = {
            classic: { name: "Winamp Блоки", glyphs: [" ", "▄", "▅", "▆", "▇", "█"], peak: "▬", color: "#00ffaa" },
            matrix: { name: "Матричная Сетка", glyphs: [" ", "0", "1"], peak: "X", color: "#33ff33" },
            runes: { name: "Скандинавские Руны", glyphs: [" ", "·", "ᚠ", "ᚢ", "ᚦ", "ᚨ", "ᚱ"], peak: "ᛟ", color: "#b464ff" },
            arrows: { name: "Стрелки Направлений", glyphs: [" ", "·", "↓", "↕", "↑"], peak: "▲", color: "#ffff00" }
        };

        function initMenu() {
            // Генерация тем
            const symbolsGrid = document.getElementById('symbolsGrid');
            symbolsGrid.innerHTML = '';
            for (let key in themes) {
                const btn = document.createElement('button');
                btn.className = `ui-btn ${key === currentTheme ? 'active' : ''}`;
                btn.textContent = themes[key].name;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    currentTheme = key;
                    document.querySelectorAll('#symbolsGrid .ui-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    resetIdleTimer();
                };
                symbolsGrid.appendChild(btn);
            }

            // Навешивание событий на типы визуализации
            document.querySelectorAll('#modesGrid .ui-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    winampMode = btn.getAttribute('data-mode');
                    document.querySelectorAll('#modesGrid .ui-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    winampPeaks = []; // Сброс старых пиков
                    resetIdleTimer();
                };
            });
        }
        initMenu();

        function resetIdleTimer() {
            panel.classList.remove('hidden');
            clearTimeout(idleTimer);
            if (isRecording) {
                idleTimer = setTimeout(() => { panel.classList.add('hidden'); }, 3500); 
            }
        }

        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('touchstart', resetIdleTimer);

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function draw() {
            if (!isRecording) return;
            animationFrameId = requestAnimationFrame(draw);
            animationTime++;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const theme = themes[currentTheme];
            ctx.fillStyle = theme.color;

            // Крупный размер сетки для идеальной разборчивости на экранах смартфонов и ПК
            const charWidth = 18;   
            const charHeight = 22;  
            ctx.font = `bold ${charHeight - 2}px monospace`;

            const columns = Math.floor(canvas.width / charWidth);
            const rows = Math.floor(canvas.height / charHeight);

            // --- 1. КЛАССИЧЕСКИЙ СПЕКТР ---
            if (winampMode === 'spectrum') {
                analyser.getByteFrequencyData(dataArray);
                for (let col = 0; col < columns; col++) {
                    const freqIdx = Math.floor((col / columns) * (bufferLength * 0.65));
                    const rawVal = dataArray[freqIdx] || 0;
                    const targetRows = Math.floor((rawVal / 255) * (rows - 3)); 

                    updateAndDrawPeaks(col, targetRows, rows, charWidth, charHeight, theme);

                    for (let r = 0; r < targetRows; r++) {
                        const yPos = canvas.height - (r * charHeight) - 15;
                        ctx.fillText(getGlyph(r, rows, theme), col * charWidth + 2, yPos);
                    }
                }
            }
            
            // --- 2. ЗЕРКАЛЬНЫЙ СПЕКТР (CENTER SPLIT) ---
            else if (winampMode === 'mirror') {
                analyser.getByteFrequencyData(dataArray);
                const midColumn = Math.floor(columns / 2);

                for (let col = 0; col < columns; col++) {
                    // Рассчитываем расстояние от центра для симметрии
                    const distanceFromCenter = Math.abs(col - midColumn);
                    const freqIdx = Math.floor((distanceFromCenter / midColumn) * (bufferLength * 0.65));
                    const rawVal = dataArray[freqIdx] || 0;
                    const targetRows = Math.floor((rawVal / 255) * (rows - 3));

                    updateAndDrawPeaks(col, targetRows, rows, charWidth, charHeight, theme);

                    for (let r = 0; r < targetRows; r++) {
                        const yPos = canvas.height - (r * charHeight) - 15;
                        ctx.fillText(getGlyph(r, rows, theme), col * charWidth + 2, yPos);
                    }
                }
            }

            // --- 3. ОГНЕННЫЙ СПЕКТР (ГЛИТЧ-ПИКИ) ---
            else if (winampMode === 'fire') {
                analyser.getByteFrequencyData(dataArray);
                for (let col = 0; col < columns; col++) {
                    const freqIdx = Math.floor((col / columns) * (bufferLength * 0.65));
                    const rawVal = dataArray[freqIdx] || 0;
                    const targetRows = Math.floor((rawVal / 255) * (rows - 4));

                    updateAndDrawPeaks(col, targetRows, rows, charWidth, charHeight, theme);

                    for (let r = 0; r < targetRows; r++) {
                        const yPos = canvas.height - (r * charHeight) - 15;
                        // Градиент прозрачности огня кверху столбика
                        ctx.globalAlpha = Math.max(0.2, 1 - (r / targetRows));
                        ctx.fillText(getGlyph(r, rows, theme), col * charWidth + 2, yPos);
                    }
                    ctx.globalAlpha = 1.0;

                    // Рисуем взрывающийся пик, если звук громкий
                    const peakRow = Math.floor(winampPeaks[col]?.y || 0);
                    if (peakRow > 0 && rawVal > 150 && Math.random() > 0.8) {
                        const explosionGlyphs = ["*", "#", "@", "!", "x"];
                        const randChar = explosionGlyphs[Math.floor(Math.random() * explosionGlyphs.length)];
                        ctx.fillText(randChar, col * charWidth + 2, canvas.height - (peakRow * charHeight) - 15);
                    }
                }
            }

            // --- 4. ОДИНАРНАЯ ВОЛНА (ОСЦИЛЛОГРАФ) ---
            else if (winampMode === 'osc') {
                analyser.getByteTimeDomainData(dataArray);
                for (let col = 0; col < columns; col++) {
                    const dataIdx = Math.floor((col / columns) * bufferLength);
                    const rawVal = dataArray[dataIdx] || 128; 
                    const targetRow = Math.floor((rawVal / 255) * rows);
                    
                    ctx.fillText(theme.glyphs[theme.glyphs.length - 1], col * charWidth, canvas.height - (targetRow * charHeight));
                }
            }

            // --- 5. ДВОЙНАЯ ВОЛНА (STEREO EFFECT) ---
            else if (winampMode === 'double_osc') {
                analyser.getByteTimeDomainData(dataArray);
                for (let col = 0; col < columns; col++) {
                    const dataIdx = Math.floor((col / columns) * bufferLength);
                    const rawVal = dataArray[dataIdx] || 128;
                    
                    // Первая верхняя волна
                    const rowTop = Math.floor((rawVal / 255) * (rows / 2));
                    ctx.fillText(theme.glyphs[Math.min(2, theme.glyphs.length - 1)], col * charWidth, rowTop * charHeight + 40);

                    // Вторая инвертированная нижняя волна
                    const rowBottom = rows - rowTop;
                    ctx.fillText(theme.glyphs[theme.glyphs.length - 1], col * charWidth, rowBottom * charHeight - 40);
                }
            }

            // --- 6. КРУГОВАЯ ВОЛНА (РАДАР) ---
            else if (winampMode === 'radial_osc') {
                analyser.getByteTimeDomainData(dataArray);
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const baseRadius = Math.min(canvas.width, canvas.height) * 0.3;
                const totalPoints = 120; // Количество символов в кольце

                for (let i = 0; i < totalPoints; i++) {
                    const dataIdx = Math.floor((i / totalPoints) * bufferLength);
                    const rawVal = dataArray[dataIdx] || 128;
                    
                    // Модуляция радиуса волной звука
                    const offset = ((rawVal - 128) / 128) * 60;
                    const radius = baseRadius + offset;

                    const angle = (i / totalPoints) * Math.PI * 2 + (animationTime * 0.003);
                    const x = centerX + Math.cos(angle) * radius * 1.3;
                    const y = centerY + Math.sin(angle) * radius * 0.8;

                    ctx.fillText(theme.glyphs[theme.glyphs.length - 1], x, y);
                }
            }
        }

        // Вспомогательные функции расчетов
        function getGlyph(r, rows, theme) {
            const glyphIdx = Math.floor((r / rows) * (theme.glyphs.length - 1)) + 1;
            return theme.glyphs[Math.min(theme.glyphs.length - 1, glyphIdx)];
        }

        function updateAndDrawPeaks(col, targetRows, rows, charWidth, charHeight, theme) {
            if (!winampPeaks[col]) winampPeaks[col] = { y: 0, speed: 0 };
            if (targetRows >= winampPeaks[col].y) {
                winampPeaks[col].y = targetRows;
                winampPeaks[col].speed = 0;
            } else {
                winampPeaks[col].speed += 0.12; 
                winampPeaks[col].y -= winampPeaks[col].speed;
            }

            const peakRow = Math.floor(winampPeaks[col].y);
            if (peakRow > 0 && peakRow < rows) {
                const peakYPos = canvas.height - (peakRow * charHeight) - 15;
                ctx.fillText(theme.peak, col * charWidth + 2, peakYPos);
            }
        }

        // Логика Старт / Пауза при тапе по фону
        canvas.onclick = async () => {
            if (!isRecording) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256; 

                    source = audioCtx.createMediaStreamSource(stream);
                    source.connect(analyser);

                    isRecording = true;
                    statusBadge.textContent = "В эфире";
                    statusBadge.style.color = "#00ffaa";
                    statusBadge.classList.add('active');
                    resetIdleTimer();
                    draw();
                } catch (e) {
                    alert('Ошибка активации аудио: ' + e);
                }
            } else {
                isRecording = false;
                cancelAnimationFrame(animationFrameId);
                if (stream) stream.getTracks().forEach(track => track.stop());
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                statusBadge.textContent = "Пауза";
                statusBadge.style.color = "#ff3c3c";
                statusBadge.classList.remove('active');
                panel.classList.remove('hidden');
            }
        };
(function injectSensitivityControl() {
    // 1. Создаем глобальную переменную чувствительности (если её еще нет)
    window.sensitivityMultiplier = 1.0;

    // 2. Добавляем CSS стили для красивого ползунка
    const style = document.createElement('style');
    style.textContent = `
        .slider-container {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px; border-radius: 8px; margin-top: 4px;
        }
        .sens-slider {
            flex-grow: 1; -webkit-appearance: none; appearance: none;
            background: rgba(255, 255, 255, 0.1); height: 6px; border-radius: 3px;
            outline: none; cursor: pointer;
        }
        .sens-slider::-webkit-slider-thumb {
            height: 16px; width: 16px; border-radius: 50%;
            background: #00ffaa; cursor: pointer; -webkit-appearance: none;
            box-shadow: 0 0 8px rgba(0, 255, 170, 0.6);
        }
        .sens-slider::-moz-range-thumb {
            height: 16px; width: 16px; border-radius: 50%;
            background: #00ffaa; cursor: pointer; border: none;
            box-shadow: 0 0 8px rgba(0, 255, 170, 0.6);
        }
    `;
    document.head.appendChild(style);

    // 3. Создаем HTML-структуру и встраиваем её в конец панели управления
    const panel = document.getElementById('control-panel');
    if (!panel) return;

    const titleDiv = document.createElement('div');
    titleDiv.className = 'section-title';
    titleDiv.style.marginTop = '12px';
    titleDiv.textContent = '🎚️ Чувствительность микрофона:';

    const containerDiv = document.createElement('div');
    containerDiv.className = 'slider-container';
    containerDiv.innerHTML = `
        <input type="range" id="sensitivity" class="sens-slider" min="20" max="300" value="100">
        <span id="sensitivityValue" style="color: #00ffaa; font-size: 11px; font-weight: bold; min-width: 45px; text-align: right;">100%</span>
    `;

    panel.appendChild(titleDiv);
    panel.appendChild(containerDiv);

    // 4. Навешиваем логику управления и защиту от кликов по фону
    const slider = document.getElementById('sensitivity');
    const valueLabel = document.getElementById('sensitivityValue');

    slider.oninput = (e) => {
        e.stopPropagation();
        valueLabel.textContent = e.target.value + '%';
        window.sensitivityMultiplier = e.target.value / 100;
        if (typeof resetIdleTimer === 'function') resetIdleTimer();
    };

    // Чтобы панель не закрывалась и трек не ставился на паузу при настройке
    const stopProp = (e) => e.stopPropagation();
    slider.onclick = stopProp;
    slider.onmousedown = stopProp;
    slider.ontouchstart = stopProp;
})();
(function injectSuperSensitivity() {
    // 1. Создаем переменную чувствительности
    window.sensitivityMultiplier = 1.0;

    // 2. Добавляем стили для ползунка в тему интерфейса
    const style = document.createElement('style');
    style.textContent = `
        .slider-container {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px; border-radius: 8px; margin-top: 4px;
        }
        .sens-slider {
            flex-grow: 1; -webkit-appearance: none; appearance: none;
            background: rgba(255, 255, 255, 0.1); height: 6px; border-radius: 3px;
            outline: none; cursor: pointer;
        }
        .sens-slider::-webkit-slider-thumb {
            height: 16px; width: 16px; border-radius: 50%;
            background: #00ffaa; cursor: pointer; -webkit-appearance: none;
            box-shadow: 0 0 8px rgba(0, 255, 170, 0.6);
        }
        .sens-slider::-moz-range-thumb {
            height: 16px; width: 16px; border-radius: 50%;
            background: #00ffaa; cursor: pointer; border: none;
            box-shadow: 0 0 8px rgba(0, 255, 170, 0.6);
        }
    `;
    document.head.appendChild(style);

    // 3. Создаем и встраиваем элементы интерфейса (максимум увеличен до 1500% для сверхчувствительности)
    const panel = document.getElementById('control-panel');
    if (!panel) return;

    const titleDiv = document.createElement('div');
    titleDiv.className = 'section-title';
    titleDiv.style.marginTop = '12px';
    titleDiv.textContent = '🎚️ Чувствительность (для слабых звуков):';

    const containerDiv = document.createElement('div');
    containerDiv.className = 'slider-container';
    containerDiv.innerHTML = `
        <input type="range" id="sensitivity" class="sens-slider" min="10" max="1500" value="100">
        <span id="sensitivityValue" style="color: #00ffaa; font-size: 11px; font-weight: bold; min-width: 50px; text-align: right;">100%</span>
    `;

    panel.appendChild(titleDiv);
    panel.appendChild(containerDiv);

    // 4. Логика ползунка
    const slider = document.getElementById('sensitivity');
    const valueLabel = document.getElementById('sensitivityValue');

    slider.oninput = (e) => {
        e.stopPropagation();
        const val = e.target.value;
        valueLabel.textContent = val + '%';
        window.sensitivityMultiplier = val / 100;
        if (typeof resetIdleTimer === 'function') resetIdleTimer();
    };

    // Защита панели управления от закрытия при кликах на ползунок
    const stopProp = (e) => e.stopPropagation();
    slider.onclick = stopProp;
    slider.onmousedown = stopProp;
    slider.ontouchstart = stopProp;

    // 5. МАГИЯ: Автоматически модифицируем функцию draw(), чтобы она учитывала чувствительность во всех режимах
    if (typeof draw === 'function') {
        let drawSource = draw.toString();

        // Модифицируем расчет частот (для спектров) с защитой от пустых значений и микро-шумов
        drawSource = drawSource.replace(
            /const rawVal = dataArray\[freqIdx\] \|\| 0;/g,
            `let baseVal = dataArray[freqIdx] || 0;
             if (baseVal > 0 && window.sensitivityMultiplier > 1) { baseVal += Math.pow(window.sensitivityMultiplier, 0.7); }
             const rawVal = Math.min(255, baseVal * window.sensitivityMultiplier);`
        );

        // Модифицируем расчет осциллограмм (для волн)
        drawSource = drawSource.replace(
            /const deviation = \(rawVal - 128\);/g,
            `const deviation = (rawVal - 128) * window.sensitivityMultiplier;`
        );
        drawSource = drawSource.replace(
            /const offset = \(\(\(rawVal - 128\) \/ 128\) \* 60\);/g,
            `const offset = (((rawVal - 128) / 128) * 60) * window.sensitivityMultiplier;`
        );

        // Пересохраняем обновленную функцию в систему
        window.draw = new Function(`return ${drawSource}`)();
    }
})();
(function injectNewThemes() {
    // 1. Проверяем, существует ли объект с темами
    if (typeof themes === 'undefined') return;

    // 2. Добавляем набор из точек и двоеточий
    themes.dots = { 
        name: "Точки и Двоеточия", 
        glyphs: [" ", ".", ":", "⁝", "⁞"], 
        peak: "·", 
        color: "#00ffaa" 
    };

    // 3. Добавляем набор из нижних подчеркиваний
    themes.underscores = { 
        name: "Нижние Линии", 
        glyphs: [" ", "_", " ▄"],
        peak: "—", 
        color: "#00ffaa" 
    };

    // 4.  " ▆" /" █"], Перерисовываем меню выбора символов, чтобы новые кнопки появились на экране
    if (typeof initMenu === 'function') {
        initMenu();
    }
})();


    </script>

</body>
</html>
