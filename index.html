<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Voice Visualizer + Video Export</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: white; 
            font-family: 'Arial', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 15px;
        }
        h1 { margin-bottom: 15px; font-size: 24px; }
        .theme-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); 
            gap: 8px; 
            margin-bottom: 20px; 
            width: 100%;
            max-width: 800px;
        }
        .theme-btn { 
            padding: 10px; 
            border: 2px solid #333; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s; 
            background: transparent; 
            color: white;
            font-size: 11px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
        }
        .theme-btn.active { 
            border-color: #fff; 
            box-shadow: 0 0 15px rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.1);
        }
        .theme-btn:hover { transform: scale(1.05); }
        canvas { 
            width: 100%; 
            max-width: 700px; 
            height: 300px; 
            background: #000; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: block;
        }
        .controls { 
            display: flex; 
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
            font-size: 14px;
        }
        #startBtn { background: #2ecc71; color: white; }
        #stopBtn { background: #e74c3c; color: white; }
        #downloadBtn { background: #3498db; color: white; }
        button:disabled { background: #555; cursor: not-allowed; }
        #audioList { 
            margin-top: 20px; 
            width: 100%; 
            max-width: 500px; 
        }
        audio, video { 
            width: 100%; 
            margin-top: 10px; 
            border-radius: 5px;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            min-height: 20px;
            text-align: center;
        }
        .recording {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <h1>🎙️ Advanced Audio Visualizer</h1>
    
    <div class="theme-grid">
        <button class="theme-btn active" data-theme="bars">📊 Bары</button>
        <button class="theme-btn" data-theme="waveform">〰️ Волна</button>
        <button class="theme-btn" data-theme="circular">⭕ Круг</button>
        <button class="theme-btn" data-theme="spiral">🌀 Спираль</button>
        <button class="theme-btn" data-theme="polar">🎯 Полярная</button>
        <button class="theme-btn" data-theme="particles">✨ Частицы</button>
        <button class="theme-btn" data-theme="mirror">🔷 Зеркало</button>
        <button class="theme-btn" data-theme="tube">🔮 Туннель</button>
        <button class="theme-btn" data-theme="plasma">⚡ Плазма</button>
        <button class="theme-btn" data-theme="flower">🌸 Цветок</button>
        <button class="theme-btn" data-theme="rings">💫 Кольца</button>
        <button class="theme-btn" data-theme="equalizer">🎚️ EQ</button>
        <button class="theme-btn" data-theme="liquid">💧 Жидкость</button>
        <button class="theme-btn" data-theme="radial">🌊 Радиал</button>
        <button class="theme-btn" data-theme="fractal">🔗 Фрактал</button>
        <button class="theme-btn" data-theme="sunset">🌅 Закат</button>
        <button class="theme-btn" data-theme="aurora">🌌 Авроры</button>
        <button class="theme-btn" data-theme="neon">⚡ Неон</button>
        <button class="theme-btn" data-theme="spectrum">🌈 Спектр</button>
        <button class="theme-btn" data-theme="void">🕳️ Пустота</button>
    </div>

    <canvas id="visualizer"></canvas>

    <div class="controls">
        <button id="startBtn">🎤</button>
        <button id="stopBtn" disabled>⏹️</button>
        <button id="downloadBtn" disabled>📥📽️</button>
    </div>

    <div class="status" id="status"></div>

    <div id="audioList"></div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const audioList = document.getElementById('audioList');
        const statusDiv = document.getElementById('status');
        const themeButtons = document.querySelectorAll('.theme-btn');

        let audioCtx, analyser, source, stream, recorder, videoRecorder;
        let chunks = [];
        let videoChunks = [];
        let currentTheme = 'bars';
        let animationTime = 0;
        let isRecording = false;
        let audioBlob = null;

        themeButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                themeButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentTheme = e.target.dataset.theme;
            });
        });

        const visualizers = {
            bars: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                const bw = w / data.length * 2.5;
                data.forEach((val, i) => {
                    ctx.fillStyle = `hsl(${(i / data.length) * 360}, 100%, ${Math.min(70, val/2)}%)`;
                    ctx.fillRect(i * bw, h - val/2, bw - 1, val/2);
                });
            },

            waveform: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                ctx.strokeStyle = '#0ff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                data.forEach((val, i) => {
                    const x = (i / data.length) * w;
                    const y = h / 2 - val / 256 * (h / 2);
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                });
                ctx.stroke();
                ctx.strokeStyle = '#0f0';
                ctx.beginPath();
                data.forEach((val, i) => {
                    const x = (i / data.length) * w;
                    const y = h / 2 + val / 256 * (h / 2);
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                });
                ctx.stroke();
            },

            circular: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                const cx = w / 2, cy = h / 2;
                const radius = Math.min(w, h) / 3;
                ctx.beginPath();
                data.forEach((val, i) => {
                    const angle = (i / data.length) * Math.PI * 2;
                    const r = radius + val / 3;
                    const x = cx + Math.cos(angle) * r;
                    const y = cy + Math.sin(angle) * r;
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                });
                ctx.closePath();
                ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
                ctx.fill();
                ctx.strokeStyle = '#0ff';
                ctx.lineWidth = 2;
                ctx.stroke();
            },

            spiral: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                const cx = w / 2, cy = h / 2;
                ctx.strokeStyle = '#0f0';
                ctx.lineWidth = 2;
                ctx.beginPath();
                data.forEach((val, i) => {
                    const angle = (i / data.length) * Math.PI * 6 + animationTime * 0.01;
                    const radius = (i / data.length) * 100 + val / 4;
                    const x = cx + Math.cos(angle) * radius;
                    const y = cy + Math.sin(angle) * radius;
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                });
                ctx.stroke();
            },

            polar: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                const cx = w / 2, cy = h / 2;
                ctx.strokeStyle = '#f0f';
                ctx.lineWidth = 1;
                for (let ring = 0; ring < 5; ring++) {
                    ctx.beginPath();
                    data.forEach((val, i) => {
                        const angle = (i / data.length) * Math.PI * 2;
                        const r = (ring + 1) * 20 + val / 5;
                        const x = cx + Math.cos(angle) * r;
                        const y = cy + Math.sin(angle) * r;
                        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                    });
                    ctx.closePath();
                    ctx.stroke();
                }
            },

            particles: (ctx, data, w, h) => {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(0, 0, w, h);
                data.forEach((val, i) => {
                    const x = (i / data.length) * w;
                    const y = h / 2;
                    const size = val / 10;
                    const hue = (i / data.length * 360 + animationTime) % 360;
                    ctx.fillStyle = `hsla(${hue}, 100%, 50%, 0.8)`;
                    ctx.beginPath();
                    ctx.arc(x, y - val, size, 0, Math.PI * 2);
                    ctx.fill();
                });
            },

            mirror: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = 'rgba(0, 255, 100, 0.5)';
                data.forEach((val, i) => {
                    const bw = w / data.length;
                    ctx.fillRect(i * bw, h / 2, bw - 1, val / 4);
                    ctx.fillRect(i * bw, h / 2 - val / 4, bw - 1, val / 4);
                });
            },

            tube: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                const cx = w / 2;
                data.forEach((val, i) => {
                    const y = (i / data.length) * h;
                    const width = val / 2;
                    const hue = (i / data.length * 360 + animationTime) % 360;
                    ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                    ctx.fillRect(cx - width / 2, y, width, h / data.length);
                });
            },

            plasma: (ctx, data, w, h) => {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(0, 0, w, h);
                const avg = data.reduce((a, b) => a + b) / data.length;
                for (let i = 0; i < data.length; i++) {
                    const x = (i / data.length) * w;
                    const noise = Math.sin(i * 0.1 + animationTime * 0.05) * 50;
                    const height = data[i] + noise;
                    ctx.fillStyle = `hsl(${animationTime + i}, 100%, ${Math.min(90, height / 2)}%)`;
                    ctx.fillRect(x, h - height / 2, w / data.length, height / 2);
                }
            },

            flower: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                const cx = w / 2, cy = h / 2;
                data.forEach((val, i) => {
                    const angle = (i / data.length) * Math.PI * 2;
                    const length = val / 2;
                    const x1 = cx + Math.cos(angle) * 30;
                    const y1 = cy + Math.sin(angle) * 30;
                    const x2 = cx + Math.cos(angle) * (30 + length);
                    const y2 = cy + Math.sin(angle) * (30 + length);
                    ctx.strokeStyle = `hsl(${(i / data.length) * 360}, 100%, 50%)`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                });
            },

            rings: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                const cx = w / 2, cy = h / 2;
                const avg = data.reduce((a, b) => a + b) / data.length;
                for (let i = 0; i < data.length; i++) {
                    const radius = (i / data.length) * 150 + avg / 3;
                    ctx.strokeStyle = `hsla(${(i / data.length) * 360}, 100%, 50%, ${0.8 - i / data.length})`;
                    ctx.lineWidth = Math.max(1, data[i] / 50);
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            },

            equalizer: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                const cols = 32;
                const bw = w / cols;
                for (let col = 0; col < cols; col++) {
                    const start = Math.floor(col * data.length / cols);
                    const end = Math.floor((col + 1) * data.length / cols);
                    let sum = 0;
                    for (let i = start; i < end; i++) sum += data[i];
                    const avg = sum / (end - start);
                    const barH = avg / 2;
                    ctx.fillStyle = `hsl(${(col / cols) * 360}, 100%, 50%)`;
                    ctx.fillRect(col * bw + 2, h - barH, bw - 4, barH);
                }
            },

            liquid: (ctx, data, w, h) => {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = 'rgba(0, 200, 255, 0.6)';
                ctx.beginPath();
                data.forEach((val, i) => {
                    const x = (i / data.length) * w;
                    const y = h - val / 2;
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                });
                ctx.lineTo(w, h);
                ctx.lineTo(0, h);
                ctx.closePath();
                ctx.fill();
            },

            radial: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                const cx = w / 2, cy = h / 2;
                const segments = 36;
                for (let seg = 0; seg < segments; seg++) {
                    const angle = (seg / segments) * Math.PI * 2;
                    const idx = Math.floor((seg / segments) * data.length);
                    const radius = data[idx] / 2;
                    const x = cx + Math.cos(angle) * radius;
                    const y = cy + Math.sin(angle) * radius;
                    ctx.fillStyle = `hsl(${(seg / segments) * 360}, 100%, 50%)`;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(x, y);
                    ctx.stroke();
                }
            },

            fractal: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                const drawFractal = (x, y, size, depth, val) => {
                    if (depth === 0 || size < 2) return;
                    const hue = (depth * 30 + animationTime) % 360;
                    ctx.fillStyle = `hsl(${hue}, 100%, ${50 + depth * 5}%)`;
                    ctx.fillRect(x, y, size, size);
                    if (val > 50) {
                        const newSize = size / 2;
                        drawFractal(x, y, newSize, depth - 1, val - 30);
                        drawFractal(x + newSize, y, newSize, depth - 1, val - 30);
                        drawFractal(x, y + newSize, newSize, depth - 1, val - 30);
                        drawFractal(x + newSize, y + newSize, newSize, depth - 1, val - 30);
                    }
                };
                const avg = data.reduce((a, b) => a + b) / data.length;
                drawFractal(w / 4, h / 4, w / 2, 4, avg);
            },

            sunset: (ctx, data, w, h) => {
                const gradient = ctx.createLinearGradient(0, 0, 0, h);
                gradient.addColorStop(0, '#1a0a2e');
                gradient.addColorStop(0.3, '#16213e');
                gradient.addColorStop(0.7, '#e94560');
                gradient.addColorStop(1, '#ffd60a');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                data.forEach((val, i) => {
                    const bw = w / data.length;
                    ctx.fillRect(i * bw, h - val / 2, bw - 1, val / 2);
                });
            },

            aurora: (ctx, data, w, h) => {
                ctx.fillStyle = 'rgba(0, 20, 40, 0.3)';
                ctx.fillRect(0, 0, w, h);
                data.forEach((val, i) => {
                    const y = (i / data.length) * h;
                    const hue = (120 + animationTime + i) % 180;
                    ctx.fillStyle = `hsla(${hue}, 100%, 50%, 0.6)`;
                    ctx.fillRect(0, y, w, h / data.length);
                });
            },

            neon: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                ctx.shadowColor = '#0ff';
                ctx.shadowBlur = 15;
                const bw = w / data.length;
                data.forEach((val, i) => {
                    ctx.fillStyle = i % 2 === 0 ? '#0ff' : '#f0f';
                    ctx.fillRect(i * bw, h - val / 2, bw - 1, val / 2);
                });
                ctx.shadowBlur = 0;
            },

            spectrum: (ctx, data, w, h) => {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, w, h);
                const bw = w / data.length;
                data.forEach((val, i) => {
                    const hue = (i / data.length * 360);
                    ctx.fillStyle = `hsl(${hue}, 100%, ${Math.min(70, val/2)}%)`;
                    ctx.fillRect(i * bw, h * 0.2, bw - 1, (val / 2) * 0.8);
                    ctx.fillRect(i * bw, h * 0.8 - (val / 2) * 0.8, bw - 1, (val / 2) * 0.8);
                });
            },

            void: (ctx, data, w, h) => {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, w, h);
                const cx = w / 2, cy = h / 2;
                const avg = data.reduce((a, b) => a + b) / data.length;
                const maxRadius = Math.min(w, h) / 2;
                const radius = (avg / 256) * maxRadius;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#0ff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        };

        startBtn.onclick = async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 256;

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                // Запись аудио
                recorder = new MediaRecorder(stream);
                chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = saveAudio;
                recorder.start();

                // Запись видео (canvas + audio)
                const canvasStream = canvas.captureStream(30);
                const audioTracks = stream.getAudioTracks();
                if (audioTracks.length > 0) {
                    canvasStream.addTrack(audioTracks[0]);
                }
                
                videoChunks = [];
                videoRecorder = new MediaRecorder(canvasStream, {
                    mimeType: 'video/webm;codecs=vp9,opus'
                });
                videoRecorder.ondataavailable = e => videoChunks.push(e.data);
                videoRecorder.start();

                isRecording = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusDiv.textContent = '🔴 Запись...';
                statusDiv.classList.add('recording');
                
                draw(analyser, dataArray, bufferLength);
            } catch (e) {
                statusDiv.textContent = '❌ Ошибка доступа к микрофону';
                console.error(e);
            }
        };

        stopBtn.onclick = () => {
            isRecording = false;
            recorder.stop();
            videoRecorder.stop();
            stream.getTracks().forEach(track => track.stop());
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.classList.remove('recording');
            statusDiv.textContent = '✅ Запись завершена';
        };

        function draw(analyser, dataArray, bufferLength) {
            if (!isRecording) return;
            requestAnimationFrame(() => draw(analyser, dataArray, bufferLength));
            analyser.getByteFrequencyData(dataArray);
            animationTime++;

            const visualizer = visualizers[currentTheme] || visualizers.bars;
            visualizer(canvasCtx, dataArray, canvas.width, canvas.height);
        }

        function saveAudio() {
            audioBlob = new Blob(chunks, { type: 'audio/ogg; codecs=opus' });
            const audioURL = URL.createObjectURL(audioBlob);
            const audio = document.createElement('audio');
            audio.controls = true;
            audio.src = audioURL;
            
            const section = document.createElement('div');
            section.innerHTML = '<h3>🔊 Аудио:</h3>';
            section.appendChild(audio);
            audioList.innerHTML = '';
            audioList.appendChild(section);
            
            downloadBtn.disabled = false;
        }

        downloadBtn.onclick = async () => {
            if (videoChunks.length === 0) {
                statusDiv.textContent = '❌ Нет видеоданных для скачивания';
                return;
            }

            statusDiv.textContent = '⏳ Обработка видео...';
            downloadBtn.disabled = true;

            try {
                const videoBlob = new Blob(videoChunks, { type: 'video/webm' });
                const videoURL = URL.createObjectURL(videoBlob);
                
                // Создание ссылки для скачивания
                const link = document.createElement('a');
                const timestamp = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
                link.href = videoURL;
                link.download = `visualizer-${timestamp}.webm`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // Добавление видео в список
                const videoEl = document.createElement('video');
                videoEl.controls = true;
                videoEl.src = videoURL;
                
                const section = document.createElement('div');
                section.innerHTML = '<h3>🎥 Видео с визуализатором:</h3>';
                section.appendChild(videoEl);
                audioList.appendChild(section);

                statusDiv.textContent = '✅ Видео скачано!';
                downloadBtn.disabled = true;
            } catch (e) {
                statusDiv.textContent = '❌ Ошибка при скачивании видео';
                console.error(e);
                downloadBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
