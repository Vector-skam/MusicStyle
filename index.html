<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Style</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0f0f2e 100%);
            font-family: 'Georgia', serif;
            color: #d4af37;
        }
        canvas { display: block; width: 100%; height: 100vh; }
        .title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            letter-spacing: 3px;
            text-shadow: 0 0 30px #d4af37, 0 0 60px rgba(212, 175, 55, 0.5);
            z-index: 20;
            animation: divine-glow 3s ease-in-out infinite;
        }
        @media (max-width: 600px) {
            .title { font-size: 18px; top: 10px; }
        }
        @keyframes divine-glow {
            0%, 100% { text-shadow: 0 0 20px #d4af37, 0 0 40px rgba(212, 175, 55, 0.4); opacity: 0.9; }
            50% { text-shadow: 0 0 40px #d4af37, 0 0 80px rgba(212, 175, 55, 0.6); opacity: 1; }
        }
        .subtitle {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            letter-spacing: 2px;
            color: #b89968;
            opacity: 0.8;
        }
        @media (max-width: 600px) {
            .subtitle { font-size: 9px; top: 40px; }
        }
        .themes {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 30;
            flex-wrap: wrap;
            max-width: 95%;
            justify-content: center;
        }
        button {
            background: rgba(20, 20, 45, 0.9);
            border: 2px solid #d4af37;
            color: #d4af37;
            padding: 6px 12px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
            font-family: 'Georgia', serif;
        }
        @media (max-width: 600px) {
            button { padding: 4px 8px; font-size: 8px; border: 1px solid #d4af37; }
        }
        button:hover, button.active {
            background: rgba(212, 175, 55, 0.15);
            color: #fff;
            box-shadow: 0 0 20px #d4af37;
            border-color: #fff;
        }
        .status {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 45, 0.98);
            border: 3px solid #d4af37;
            padding: 15px 35px;
            z-index: 30;
            cursor: pointer;
            font-size: 16px;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.7);
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            animation: pulse-button 2s ease-in-out infinite;
        }
        @media (max-width: 600px) {
            .status { top: 70px; padding: 10px 25px; font-size: 12px; border: 2px solid #d4af37; }
        }
        @keyframes pulse-button {
            0%, 100% { box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 0 50px rgba(212, 175, 55, 0.6); }
        }
        .status:hover {
            box-shadow: 0 0 60px #d4af37;
            background: rgba(212, 175, 55, 0.1);
            color: #fff;
            border-color: #fff;
        }
        .status.active {
            background: rgba(0, 150, 100, 0.2);
            border-color: #00ff88;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88;
            box-shadow: 0 0 60px #00ff88;
            animation: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="title">✨ КВАНТОВОЕ ОЗАРЕНИЕ ✨</div>
    <div class="subtitle">ФАНТАСТИЧЕСКИЕ ВОЛНЫ МУЗЫКИ</div>
    <div class="status" id="status">🎤 ВКЛЮЧИ МИКРОФОН 🎸</div>

    <div class="themes">
        <button data-theme="linear-wave" class="active">ВОЛНА</button>
        <button data-theme="linear-spike">ШИПЫ</button>
        <button data-theme="particles">ЧАСТИЦЫ</button>
        <button data-theme="spiral">СПИРАЛИ</button>
        <button data-theme="mandala">МАНДАЛА</button>
        <button data-theme="quantum">КВАНТУМ</button>
        <button data-theme="fractal">ФРАКТАЛ</button>
        <button data-theme="aurora">АВРОРА</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let audioCtx, analyser, dataArray, stream;
        let isActive = false;
        let currentTheme = 'linear-wave';
        let time = 0;
        let particles = [];

        // Проверка мобильного устройства
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const maxParticles = isMobile ? 80 : 250;

        class Particle {
            constructor(x, y, vx, vy, color, life) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = life;
                this.maxLife = life;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }
            draw(ctx) {
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const statusBtn = document.getElementById('status');
        const themeBtns = document.querySelectorAll('.themes button');

        themeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                themeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTheme = btn.dataset.theme;
                particles = [];
            });
        });

        async function startMic() {
            if (isActive) return;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.75;

                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                isActive = true;
                statusBtn.classList.add('active');
                statusBtn.textContent = "🎤 МИКРОФОН ВКЛ — ИГРАЙ! 🎸";
                draw();
            } catch (e) {
                statusBtn.textContent = "❌ ДОСТУП К МИКРОФОНУ ЗАПРЕЩЕН";
            }
        }

        statusBtn.addEventListener('click', startMic);

        function getThemeColors(theme, avg) {
            const themes = {
                'linear-wave': { main: '#d4af37', accent: '#ffed4e', shadow: '#f0d800' },
                'linear-spike': { main: '#87ceeb', accent: '#e0ffff', shadow: '#00ffff' },
                particles: { main: '#d4af37', accent: '#ffed4e', shadow: '#f0d800' },
                spiral: { main: '#87ceeb', accent: '#e0ffff', shadow: '#00ffff' },
                mandala: { main: '#ff69b4', accent: '#ff1493', shadow: '#ff00ff' },
                quantum: { main: '#00ff88', accent: '#00ffcc', shadow: '#00ff99' },
                fractal: { main: '#ffd700', accent: '#ffff00', shadow: '#ffed4e' },
                aurora: { main: '#98fb98', accent: '#00ff7f', shadow: '#7fffd4' }
            };
            return themes[theme] || themes['linear-wave'];
        }

        function draw() {
            requestAnimationFrame(draw);
            if (!analyser || !isActive) return;

            time++;
            analyser.getByteFrequencyData(dataArray);
            
            ctx.fillStyle = 'rgba(10, 14, 39, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;
            const centerX = w / 2;
            const centerY = h / 2;

            let avg = 0;
            for (let i = 0; i < dataArray.length; i++) avg += dataArray[i];
            avg = avg / dataArray.length / 255;

            const colors = getThemeColors(currentTheme, avg);

            if (currentTheme === 'linear-wave') {
                drawLinearWave(centerX, centerY, avg, colors);
            } else if (currentTheme === 'linear-spike') {
                drawLinearSpike(centerX, centerY, avg, colors);
            } else if (currentTheme === 'particles') {
                drawParticles(centerX, centerY, avg, colors);
            } else if (currentTheme === 'spiral') {
                drawSpiral(centerX, centerY, avg, colors);
            } else if (currentTheme === 'mandala') {
                drawMandala(centerX, centerY, avg, colors);
            } else if (currentTheme === 'quantum') {
                drawQuantum(centerX, centerY, avg, colors);
            } else if (currentTheme === 'fractal') {
                drawFractal(centerX, centerY, avg, colors);
            } else if (currentTheme === 'aurora') {
                drawAurora(centerX, centerY, avg, colors);
            }
        }

        function drawLinearWave(cx, cy, avg, colors) {
            const shadowBlur = isMobile ? 15 : 30;
            ctx.shadowBlur = shadowBlur;
            ctx.shadowColor = colors.shadow;
            ctx.lineWidth = 2.5 + avg * 5;
            ctx.strokeStyle = colors.main;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            const step = isMobile ? 4 : 2;
            for (let i = 0; i < dataArray.length; i += step) {
                const val = dataArray[i] / 255;
                const x = (i / dataArray.length) * canvas.width;
                let y = cy - (val * canvas.height * 0.4);

                if (val > 0.6) y -= (val - 0.6) * 60;
                y += Math.sin(i * 0.3) * val * 15;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();
        }

        function drawLinearSpike(cx, cy, avg, colors) {
            const shadowBlur = isMobile ? 20 : 35;
            ctx.shadowBlur = shadowBlur;
            ctx.shadowColor = colors.shadow;
            ctx.lineWidth = 2 + avg * 5;
            ctx.strokeStyle = colors.main;
            ctx.lineCap = 'round';

            ctx.beginPath();
            const step = isMobile ? 3 : 1;
            for (let i = 0; i < dataArray.length; i += step) {
                const val = dataArray[i] / 255;
                const x = (i / dataArray.length) * canvas.width;
                let y = cy - (val * canvas.height * 0.45);

                if (val > 0.65) y -= (val - 0.65) * 100;
                if (i % 3 === 0) y += Math.sin(i * 0.3) * val * 10;

                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            if (!isMobile) {
                ctx.lineWidth = 1;
                ctx.shadowBlur = 30;
                for (let i = 15; i < dataArray.length - 15; i += 20) {
                    const val = dataArray[i] / 255;
                    if (val > 0.7) {
                        const x = (i / dataArray.length) * canvas.width;
                        const y = cy - (val * canvas.height * 0.5);
                        ctx.beginPath();
                        ctx.moveTo(x - 10, y + 25);
                        ctx.lineTo(x, y - 50);
                        ctx.lineTo(x + 10, y + 25);
                        ctx.stroke();
                    }
                }
            }
        }

        function drawParticles(cx, cy, avg, colors) {
            ctx.shadowBlur = isMobile ? 15 : 30;
            ctx.shadowColor = colors.shadow;

            const step = isMobile ? 12 : 8;
            for (let i = 0; i < dataArray.length; i += step) {
                const val = dataArray[i] / 255;
                const angle = (i / dataArray.length) * Math.PI * 2;
                const distance = 80 + val * 250;
                
                const x = cx + Math.cos(angle) * distance;
                const y = cy + Math.sin(angle) * distance;

                const particleCount = Math.floor(val * (isMobile ? 5 : 15));
                for (let p = 0; p < particleCount; p++) {
                    if (particles.length > maxParticles) break;
                    const vx = Math.cos(angle + Math.random()) * (1.5 + val * 3);
                    const vy = Math.sin(angle + Math.random()) * (1.5 + val * 3);
                    particles.push(new Particle(x, y, vx, vy, colors.accent, 50 + val * 60));
                }

                ctx.fillStyle = colors.main;
                ctx.globalAlpha = 0.7;
                ctx.beginPath();
                ctx.arc(x, y, 2.5 + val * 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });
            particles = particles.filter(p => p.life > 0);
        }

        function drawSpiral(cx, cy, avg, colors) {
            ctx.shadowBlur = isMobile ? 20 : 35;
            ctx.shadowColor = colors.shadow;

            const step = isMobile ? 4 : 2;
            for (let i = 0; i < dataArray.length; i += step) {
                const val = dataArray[i] / 255;
                const angle = (i / dataArray.length) * Math.PI * 6 + time * 0.01;
                const distance = (i / dataArray.length) * 300 + val * 120;
                
                const x = cx + Math.cos(angle) * distance;
                const y = cy + Math.sin(angle) * distance;

                ctx.fillStyle = colors.accent;
                ctx.globalAlpha = val * 0.6;
                ctx.beginPath();
                ctx.arc(x, y, 1.5 + val * 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function drawMandala(cx, cy, avg, colors) {
            ctx.shadowBlur = isMobile ? 20 : 30;
            ctx.shadowColor = colors.shadow;

            const rings = isMobile ? 5 : 8;
            for (let r = 0; r < rings; r++) {
                ctx.lineWidth = 1 + avg * 2;
                ctx.strokeStyle = colors.main;
                ctx.beginPath();
                
                const step = isMobile ? 3 : 1;
                for (let i = 0; i < dataArray.length; i += step) {
                    const val = dataArray[(i + r * 25) % dataArray.length] / 255;
                    const angle = (i / dataArray.length) * Math.PI * 2;
                    const distance = (r + 1) * 35 + val * 80;
                    
                    const x = cx + Math.cos(angle) * distance;
                    const y = cy + Math.sin(angle) * distance;
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }
        }

        function drawQuantum(cx, cy, avg, colors) {
            ctx.shadowBlur = isMobile ? 30 : 50;
            ctx.shadowColor = colors.shadow;

            const waves = isMobile ? 6 : 10;
            for (let w = 0; w < waves; w++) {
                ctx.strokeStyle = colors.accent;
                ctx.globalAlpha = (1 - w / waves) * avg * 0.5;
                ctx.lineWidth = 2 - w * 0.15;

                ctx.beginPath();
                const step = isMobile ? 2 : 1;
                for (let i = 0; i < dataArray.length; i += step) {
                    const val = dataArray[i] / 255;
                    const angle = (i / dataArray.length) * Math.PI * 2 + w * 0.3;
                    const distance = 70 + val * 180 + w * 20;
                    
                    const x = cx + Math.cos(angle) * distance;
                    const y = cy + Math.sin(angle) * distance;
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }

        function drawFractal(cx, cy, avg, colors) {
            ctx.shadowBlur = isMobile ? 25 : 40;
            ctx.shadowColor = colors.shadow;

            function drawBranch(x, y, angle, depth, val) {
                if (depth === 0 || depth < (isMobile ? 4 : 2)) return;

                const length = 30 * (val + 0.4) * (depth / 6);
                const newX = x + Math.cos(angle) * length;
                const newY = y + Math.sin(angle) * length;

                ctx.strokeStyle = colors.main;
                ctx.globalAlpha = (depth / 8) * val * 0.7;
                ctx.lineWidth = Math.max(0.5, depth * 0.3);
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(newX, newY);
                ctx.stroke();

                const spread = val * 0.5;
                drawBranch(newX, newY, angle - spread, depth - 1, val);
                drawBranch(newX, newY, angle + spread, depth - 1, val);
            }

            const baseVal = avg;
            const branches = isMobile ? 4 : 6;
            for (let i = 0; i < branches; i++) {
                const angle = (i / branches) * Math.PI * 2;
                drawBranch(cx, cy, angle, isMobile ? 6 : 8, baseVal);
            }
            ctx.globalAlpha = 1;
        }

        function drawAurora(cx, cy, avg, colors) {
            ctx.shadowBlur = isMobile ? 40 : 60;
            ctx.shadowColor = colors.shadow;

            const waves = isMobile ? 12 : 20;
            for (let w = 0; w < waves; w++) {
                const offset = (time + w * 4) * 0.01;
                
                ctx.beginPath();
                const step = isMobile ? 3 : 2;
                for (let i = 0; i < dataArray.length; i += step) {
                    const val = dataArray[i] / 255;
                    const x = (i / dataArray.length) * w * 25;
                    const y = cy + Math.sin(x * 0.015 + offset) * (80 + val * 120) - w * 12;
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                
                ctx.strokeStyle = colors.main;
                ctx.globalAlpha = (1 - w / waves) * avg * 0.4;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }
    </script>
</body>
</html>
